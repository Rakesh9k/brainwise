# apphosting.yaml
# Production Configuration for BrainWise on Firebase App Hosting

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 1
  maxInstances: 50
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
  - variable: PORT
    value: "8080"
  - variable: FIREBASE_PROJECT_ID
    value: brainwise-ai-marketing-engine
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: CASHFREE_APP_ID
    secret: CASHFREE_APP_ID
  - variable: CASHFREE_SECRET_KEY
    secret: CASHFREE_SECRET_KEY
  - variable: CASHFREE_WEBHOOK_SECRET
    secret: CASHFREE_WEBHOOK_SECRET
  - variable: META_APP_SECRET
    secret: META_APP_SECRET
  - variable: META_TOKEN_ENCRYPTION_KEY
    secret: META_TOKEN_ENCRYPTION_KEY
